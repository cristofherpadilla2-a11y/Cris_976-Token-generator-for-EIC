<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style%202.css">
</head>
<body>

  <h1>Welcome User</h1>
  
  <div class="nav-buttons">
    <button>Dashboard</button>
    <button>Global Chat</button>
    <button>Change Username</button>
    <a href="#">Join my Discord</a>
  </div>
  <button>&larr; Back to Menu</button>

  <h2>Dashboard</h2>
  <button>Generate Code</button>
  <button>Generate Token</button>
  <button>Change "Generate Token code message" (Owner use only)</button>
  <button>Change "Generate Token message" (Owner use only)</button>
  <button>0sec-cooldown list</button>

  <p>Generating...</p>
  <button>&larr; Back to Menu</button>

  <h2>Global Chat</h2>
  <input type="text" placeholder="Type a message...">
  <button>Send</button>
  <br>
  <button>&larr; Back to Menu</button>

  <h2>Change Username</h2>
  <input type="text" placeholder="Enter new username">
  <button>Save Name</button>

  <h2>Owner Controls</h2>
  <input type="password" placeholder="Enter Owner Passcode">
  <input type="text" placeholder="Enter custom output">
  <br>
  <button>Submit</button>
  <button>Cancel</button>

  <script src="script%202.js"></script>
</body>
</html>
