<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Generator</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Fallback fix ensuring hidden utility class works regardless of stylesheet loading -->
  <style>
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- Moving Galaxy Background -->
  <div class="galaxy-background"></div>
  <div class="stars-background"></div>

  <div class="app-container">

    <!-- First-Time Name Setup Screen (Shows if user hasn't set a name) -->
    <section id="first-time-section" class="screen">
      <h2>Welcome!</h2>
      <p style="text-align: center; margin-bottom: 15px; color: #8b949e;">Please insert your name to continue into the app.</p>
      <form id="first-time-form" class="form-container">
        <input type="text" id="first-time-input" placeholder="Insert your name" required autocomplete="off">
        <button type="submit" id="btn-enter-app" class="pill-btn action-btn">Enter App</button>
      </form>
    </section>

    <!-- Main App Layout (Hidden until name is set) -->
    <div id="main-app-wrapper" class="hidden">
      <!-- Active Presence Header Banner -->
      <div class="presence-bar">
        <button id="btn-active-modal" class="active-banner-btn">
          <span class="active-label">Active:</span> 
          <span id="active-count">0</span> | 
          <span class="inactive-label">Inactive:</span> 
          <span id="inactive-count">0</span>
        </button>
      </div>

      <header class="app-header">
        <h1 id="header-username">Welcome User</h1>
      </header>

      <!-- Homepage Screen -->
      <nav id="menu-section" class="screen">
        <div class="pill-container">
          <button id="btn-to-dashboard" class="pill-btn">Dashboard</button>
          <button id="btn-to-leaderboard" class="pill-btn">Leaderboard</button>
          <button id="btn-to-chat" class="pill-btn">Global Chat</button>
          <button id="btn-to-name" class="pill-btn">Change Username</button>
          <a href="https://discord.gg/9auXgRgwd" target="_blank" id="btn-discord" class="pill-btn discord-btn">Join my Discord</a>
        </div>
      </nav>

      <section id="dash-section" class="screen hidden">
        <button class="back-btn" data-target="menu-section">← Back to Menu</button>
        <h2>Dashboard</h2>
        
        <div class="pill-container">
          <button id="btn-gen-code" class="pill-btn">Generate Code</button>
          <button id="btn-gen-token" class="pill-btn">Generate Token</button>
          
          <button id="btn-change-code-msg" class="pill-btn action-btn">Change "Generate Token code message" (Owner use only)</button>
          <button id="btn-change-token-msg" class="pill-btn action-btn">Change "Generate Token message" (Owner use only)</button>
          <button id="btn-cooldown-list" class="pill-btn action-btn">0sec-cooldown list</button>
        </div>

        <div id="gen-display" class="display-box hidden">
          <p id="gen-status">Generating...</p>
          <div id="gen-result" class="result-text"></div>
        </div>
      </section>

      <!-- Leaderboard Screen -->
      <section id="leaderboard-section" class="screen hidden">
        <button class="back-btn" data-target="menu-section">← Back to Menu</button>
        <h2>Leaderboard</h2>
        <div id="leaderboard-list" class="status-list-container"></div>
      </section>

      <section id="chat-section" class="screen hidden">
        <button class="back-btn" data-target="menu-section">← Back to Menu</button>
        <h2>Global Chat</h2>
        <div id="chat-box" class="chat-display"></div>
        
        <form id="chat-form" class="chat-input-container">
          <input type="text" id="chat-input" placeholder="Type a message..." required autocomplete="off">
          <button type="submit" class="pill-btn action-btn">Send</button>
        </form>
      </section>

      <section id="name-section" class="screen hidden">
        <button class="back-btn" data-target="menu-section">← Back to Menu</button>
        <h2>Change Username</h2>
        <form id="name-form" class="form-container">
          <input type="text" id="name-input" placeholder="Enter new username" required autocomplete="off">
          <button type="submit" id="btn-save-name" class="pill-btn action-btn">Save Name</button>
        </form>
      </section>

      <!-- Active Users Modal -->
      <div id="users-modal" class="modal hidden">
        <div class="modal-content">
          <h3>User Status</h3>
          <div id="users-list" class="status-list-container"></div>
          <div class="modal-actions">
            <button type="button" id="btn-close-users-modal" class="pill-btn cancel-btn">Close</button>
          </div>
        </div>
      </div>

      <!-- Owner Controls Modal -->
      <div id="owner-modal" class="modal hidden">
        <div class="modal-content">
          <h3 id="modal-title">Owner Controls</h3>

          <form id="owner-form">
            <input type="password" id="owner-pass" placeholder="Enter Owner Passcode">

            <div id="owner-override-field" class="hidden">
              <input type="text" id="owner-new-msg" placeholder="Enter custom output">
            </div>

            <p id="owner-status"></p>

            <div class="modal-actions">
              <button type="submit" class="pill-btn action-btn">Submit</button>
              <button type="button" id="btn-close-modal" class="pill-btn cancel-btn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
